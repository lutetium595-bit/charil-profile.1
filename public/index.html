<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a6ccff"><title>챠릴 | Charil</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<div class="sky-decor" aria-hidden="true"><span class="star st1">☆</span><span class="star st2">✦</span><span class="star st3">✧</span><span class="star st4">✦</span><span class="cloud c1"></span><span class="cloud c2"></span></div>
<header class="site-header"><a class="brand" href="#home">Charil<span>✦</span></a><nav aria-label="주 메뉴"><button class="nav-btn active" data-page="home">⌂ <span>홈</span></button><button class="nav-btn" data-page="schedule">▦ <span>일정표</span></button><button class="nav-btn" data-page="notice">▤ <span>공지사항</span></button><button class="nav-btn" data-page="outfit">♧ <span>의상목록</span></button><button class="nav-btn" data-page="reputation">▱ <span>업보목록</span></button></nav><button class="admin-trigger" id="adminTrigger" title="관리자 모드">⚙</button></header>
<main class="main-wrap"><section id="home" class="page active"><div class="home-grid"><div class="portrait-panel"><span class="portrait-star">☆</span><img id="portrait" src="/assets/profile-sample.webp" alt="프로필 사진"><span class="portrait-sign">Charil ♡</span></div><div class="profile-panel"><div class="name-mark"><span class="cat-ears" aria-hidden="true"></span><h1 id="profileName">챠릴</h1><span class="comet">✦</span></div><p class="subtitle" id="profileSubtitle">Charil</p><div class="info-rows"><div class="info-row"><strong>▦ &nbsp;생일</strong><span data-profile="birthday"></span></div><div class="info-row"><strong>✧ &nbsp;첫 방송일</strong><span data-profile="firstBroadcast"></span></div><div class="info-row"><strong>♡ &nbsp;MBTI</strong><span data-profile="mbti"></span></div><div class="info-row"><strong>◷ &nbsp;고정 방송 시간</strong><span data-profile="fixedTime"></span></div><div class="info-row tall"><strong>▦ &nbsp;방송 요일</strong><span data-profile="broadcastDays"></span></div><div class="info-row tall"><strong>♥ &nbsp;좋아하는 것</strong><span data-profile="likes"></span></div></div></div><section class="week-panel"><div class="week-head"><h2>▦ 주간 일정 <i></i></h2><div class="week-control"><button id="prevWeek" aria-label="이전 주">❮</button><span id="weekLabel"></span><button id="nextWeek" aria-label="다음 주">❯</button></div></div><div class="week-rows" id="homeWeek"></div></section></div></section>
<section id="schedule" class="page subpage"><div class="section-head"><div><p class="eyebrow">CHARIL CALENDAR</p><h2>일정표</h2><p>주간 방송 일정을 확인할 수 있어요.</p></div><div class="week-control large"><button id="prevWeekFull">❮</button><span id="weekLabelFull"></span><button id="nextWeekFull">❯</button></div></div><div class="full-week" id="fullWeek"></div></section>
<section id="notice" class="page subpage"><div class="section-head"><div><p class="eyebrow">NOTICE</p><h2>공지사항</h2><p>새로운 소식을 확인해 주세요.</p></div><button class="add-btn admin-only" data-add="notice">+ 공지 추가</button></div><div class="entry-list" id="noticeList"></div></section>
<section id="outfit" class="page subpage"><div class="section-head"><div><p class="eyebrow">DRESSING ROOM</p><h2>의상목록</h2><p>의상과 사진을 모아볼 수 있어요.</p></div><button class="add-btn admin-only" data-add="outfit">+ 의상 추가</button></div><div class="entry-grid" id="outfitList"></div></section>
<section id="reputation" class="page subpage"><div class="section-head"><div><p class="eyebrow">REPUTATION</p><h2>업보목록</h2><p>기록을 한눈에 확인해요.</p></div><button class="add-btn admin-only" data-add="reputation">+ 기록 추가</button></div><div class="entry-grid" id="reputationList"></div></section></main>
<footer>✦ &nbsp; Charil &nbsp; ✦</footer>
<div class="modal-backdrop" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="닫기">✕</button></div><div id="modalBody"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
